name: Update Stats
"on":
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:        # manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats from CountAPI
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, datetime, os

          BASE = "https://countapi.mileshilliard.com/api/v1"
          NS   = "ronenz90-idf-delek"
          OUT  = "stats.json"

          def get(key):
              url = f"{BASE}/get/{NS}-{key}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "StatsBot/1.0"})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return json.loads(r.read()).get("value", 0)
              except:
                  return None  # None = failed to fetch (keep old value)

          # Load existing stats
          data = {"total": 0, "daily": {}}
          if os.path.exists(OUT):
              with open(OUT) as f:
                  data = json.load(f)

          # Fetch total
          total = get("visits")
          if total is not None:
              data["total"] = total

          # Fetch daily from launch date to today
          launch = datetime.date(2026, 5, 24)
          today  = datetime.date.today()
          updated = 0
          d = launch
          while d <= today:
              key = d.strftime("%Y-%m-%d")
              val = get(key)
              if val is not None:
                  data["daily"][key] = val
                  updated += 1
              d += datetime.timedelta(days=1)

          data["updated"] = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")

          with open(OUT, "w") as f:
              json.dump(data, f, separators=(",", ":"))

          print(f"Total: {data['total']}, Days updated: {updated}")
          PYEOF

      - name: Commit stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "auto: update stats [skip ci]"
          git push
