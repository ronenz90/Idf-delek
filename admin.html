<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול — תחנות דלק</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#110b02;--bg2:#1e1308;--card:#231608;--card2:#2c1c0a;
  --orange:#f5960a;--orange2:#e07c00;
  --txt:#f0e8d8;--muted:#9a8870;--faint:#5a4a38;
  --border:rgba(245,150,10,0.2);
}
html,body{width:100%;overflow-x:hidden}
body{font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;direction:rtl;padding-bottom:40px}
.header{background:var(--orange);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:700;color:#fff}
.back-btn{font-size:13px;color:rgba(255,255,255,0.85);text-decoration:none}
.content{padding:14px;max-width:600px;margin:0 auto}
.stats-row{display:flex;gap:10px;margin-bottom:16px}
.stat-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat-val{font-size:28px;font-weight:800;color:var(--orange);line-height:1}
.stat-label{font-size:11px;color:var(--muted);margin-top:4px}
.filter-tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:8px;border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;border:1px solid var(--faint);background:var(--card);color:var(--muted);cursor:pointer;transition:all .2s}
.tab.active{background:rgba(245,150,10,0.15);border-color:var(--orange);color:var(--orange)}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.chart-title{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.chart-wrap{position:relative;height:200px}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}
.table-header{padding:12px 14px;font-size:12px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.table-row{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.04);font-size:14px}
.table-row:last-child{border-bottom:none}
.table-row .date{color:var(--muted);font-size:13px}
.table-row .count{font-weight:700;color:var(--orange)}
.bar-bg{flex:1;height:6px;background:var(--faint);border-radius:3px;margin:0 12px;overflow:hidden}
.bar-fill{height:6px;background:var(--orange);border-radius:3px}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.spinner{width:32px;height:32px;border:3px solid var(--faint);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:rgba(220,60,60,0.1);border:1px solid rgba(220,60,60,0.3);color:#ff7070;padding:12px;border-radius:10px;font-size:13px;text-align:center}
#pw-gate{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.pw-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px 24px;max-width:320px;width:100%;text-align:center}
.pw-input{width:100%;padding:12px;background:var(--bg2);border:1px solid var(--faint);border-radius:10px;color:var(--txt);font-size:16px;font-family:inherit;text-align:center;outline:none;margin-bottom:10px}
.pw-btn{width:100%;padding:13px;background:linear-gradient(135deg,#f5960a,#e07c00);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
#app-content{display:none}
</style>
</head>
<body>
<div id="pw-gate">
  <div class="pw-box">
    <div style="font-size:36px;margin-bottom:12px">&#128274;</div>
    <div style="font-size:18px;font-weight:700;color:var(--orange);margin-bottom:6px">פאנל ניהול</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:20px">הזן סיסמה להמשך</div>
    <input id="pw-input" class="pw-input" type="password" placeholder="סיסמה" autocomplete="off"
      onkeydown="if(event.key==='Enter')checkPw()"/>
    <button class="pw-btn" onclick="checkPw()">כניסה</button>
    <div id="pw-err" style="color:#ff7070;font-size:13px;margin-top:10px;min-height:18px"></div>
  </div>
</div>

<div id="app-content">
  <div class="header">
    <h1>&#128202; פאנל ניהול</h1>
    <a href="./index.html" class="back-btn">&#8594; חזרה לאפליקציה</a>
  </div>
  <div class="content">
    <div id="main-content">
      <div class="loading"><div class="spinner"></div>טוען נתונים...</div>
    </div>
  </div>
</div>

<script>
var HASH = "1db8a2da32d0872c8d74c26ca155febd1195e9af042ed56b919c98787c5c6424";

var allData = {}, chartInstance = null;

async function checkPw() {
  var pw = document.getElementById("pw-input").value;
  var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
  var hash = Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  if (hash === HASH) {
    sessionStorage.setItem("admin_ok","1");
    document.getElementById("pw-gate").style.display = "none";
    document.getElementById("app-content").style.display = "block";
    init();
  } else {
    document.getElementById("pw-err").textContent = "סיסמה שגויה";
    document.getElementById("pw-input").value = "";
    document.getElementById("pw-input").focus();
  }
}

if (sessionStorage.getItem("admin_ok") === "1") {
  document.getElementById("pw-gate").style.display = "none";
  document.getElementById("app-content").style.display = "block";
  window.addEventListener("load", init);
} else {
  window.addEventListener("load", function(){ document.getElementById("pw-input").focus(); });
}

function dateStr(d){ return d.toISOString().slice(0,10); }
function getDateRange(n){
  var arr=[], now=new Date();
  for(var i=n-1;i>=0;i--){var d=new Date(now);d.setDate(d.getDate()-i);arr.push(dateStr(d));}
  return arr;
}
function fmtHE(s){var p=s.split('-');return p[2]+'/'+p[1];}
function fmtFull(s){var p=s.split('-');var days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];return days[new Date(s).getDay()]+' '+p[2]+'/'+p[1]+'/'+p[0];}
function sum(arr){return arr.reduce(function(a,d){return a+(allData[d]||0);},0);}

var BASE_CM = "https://countapi.mileshilliard.com/api/v1";
var NS = "ronenz90-idf-delek";

function jsonpGet(key) {
  return new Promise(function(resolve) {
    var cbName = 'gc_' + Math.random().toString(36).slice(2);
    var done = false;
    var timer = setTimeout(function() {
      if (!done) { done=true; cleanup(); resolve(0); }
    }, 8000);
    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      var el = document.getElementById('jsonp_'+cbName);
      if (el) el.parentNode.removeChild(el);
    }
    window[cbName] = function(data) {
      if (!done) { done=true; cleanup(); resolve(data.value || 0); }
    };
    var s = document.createElement('script');
    s.id = 'jsonp_' + cbName;
    s.onerror = function() { if (!done) { done=true; cleanup(); resolve(0); } };
    s.src = BASE_CM + "/get/" + NS + "-" + key + "?callback=" + cbName;
    document.head.appendChild(s);
  });
}

async function getCount(key) {
  return jsonpGet(key);
}

async function fetchAllData(){
  var dates = getDateRange(90);
  for(var i=0;i<dates.length;i++){
    var count = await jsonpGet("d-"+dates[i]);
    allData[dates[i]] = count;
    await new Promise(function(res){setTimeout(res,100);});
  }
}

function renderPeriod(days){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',parseInt(t.dataset.days)===days);});
  var dates=getDateRange(days), labels=[], values=[], rows=[];
  if(days<=30){
    dates.forEach(function(d){labels.push(fmtHE(d));values.push(allData[d]||0);rows.push({l:fmtFull(d),c:allData[d]||0});});
  } else {
    for(var i=0;i<Math.ceil(dates.length/7);i++){
      var w=dates.slice(i*7,i*7+7);if(!w.length)break;
      var s=sum(w),l=fmtHE(w[0])+'-'+fmtHE(w[w.length-1]);
      labels.push(l);values.push(s);rows.push({l:l,c:s});
    }
  }
  var tot=sum(dates), avg=tot>0?Math.round(tot/(days>30?Math.ceil(days/7):days)):0, mx=values.length?Math.max.apply(null,values):0;
  document.getElementById('stat-period').textContent=Number(tot).toLocaleString();
  document.getElementById('stat-avg').textContent=Number(avg).toLocaleString();
  document.getElementById('stat-max').textContent=Number(mx).toLocaleString();
  document.getElementById('stat-label-period').textContent=days===7?'7 ימים אחרונים':days===30?'30 ימים אחרונים':'90 ימים אחרונים';
  document.getElementById('stat-label-avg').textContent=days>30?'ממוצע שבועי':'ממוצע יומי';
  if(chartInstance){chartInstance.destroy();chartInstance=null;}
  chartInstance=new Chart(document.getElementById('visits-chart').getContext('2d'),{
    type:'bar',
    data:{labels:labels,datasets:[{data:values,backgroundColor:'rgba(245,150,10,0.7)',borderColor:'rgba(245,150,10,1)',borderWidth:1,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ' '+ctx.raw+' כניסות';}}}},
      scales:{x:{ticks:{color:'#9a8870',font:{size:10},maxRotation:45},grid:{color:'rgba(255,255,255,0.04)'}},
              y:{ticks:{color:'#9a8870',font:{size:10}},grid:{color:'rgba(255,255,255,0.06)'},beginAtZero:true}}}
  });
  var sorted=rows.slice().sort(function(a,b){return b.c-a.c;});
  var maxV=sorted[0]?sorted[0].c:1;
  document.getElementById('table-body').innerHTML=sorted.slice(0,15).map(function(r){
    var pct=maxV>0?Math.round(r.c/maxV*100):0;
    return '<div class="table-row"><span class="date">'+r.l+'</span>'+
      '<div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
      '<span class="count">'+r.c+'</span></div>';
  }).join('')||'<div style="padding:14px;color:var(--muted);text-align:center;font-size:13px">אין נתונים</div>';
}

async function init(){
  try {
    var total = await getCount("visits");
    await fetchAllData();
    var today = allData[dateStr(new Date())]||0;
    document.getElementById('main-content').innerHTML=
      '<div class="stats-row">'+
        '<div class="stat-card"><div class="stat-val">'+Number(total).toLocaleString()+'</div><div class="stat-label">סה"כ כניסות</div></div>'+
        '<div class="stat-card"><div class="stat-val" id="stat-period">-</div><div class="stat-label" id="stat-label-period">תקופה</div></div>'+
        '<div class="stat-card"><div class="stat-val">'+today+'</div><div class="stat-label">היום</div></div>'+
      '</div>'+
      '<div class="filter-tabs">'+
        '<button class="tab" data-days="7" onclick="renderPeriod(7)">7 ימים</button>'+
        '<button class="tab active" data-days="30" onclick="renderPeriod(30)">30 ימים</button>'+
        '<button class="tab" data-days="90" onclick="renderPeriod(90)">90 ימים</button>'+
      '</div>'+
      '<div class="chart-card">'+
        '<div class="chart-title"><span>&#128202; גרף כניסות</span>'+
        '<span><span id="stat-avg" style="color:var(--orange);font-weight:700">-</span> '+
        '<span id="stat-label-avg" style="font-size:11px;color:var(--muted)">ממוצע יומי</span></span></div>'+
        '<div class="chart-wrap"><canvas id="visits-chart"></canvas></div>'+
      '</div>'+
      '<div class="table-card">'+
        '<div class="table-header"><span>תאריך</span><span>&#128205; שיא <span id="stat-max" style="color:var(--orange)">-</span></span></div>'+
        '<div id="table-body"></div>'+
      '</div>';
    renderPeriod(30);
  } catch(e) {
    document.getElementById('main-content').innerHTML='<div class="error-box">שגיאה: '+e.message+'</div>';
  }
}
</script>
</body>
</html>
